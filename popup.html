<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 380px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    
    .header {
      background: linear-gradient(135deg, #1877f2, #42b72a);
      color: white;
      padding: 16px;
      text-align: center;
    }
    
    .header h1 {
      font-size: 18px;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .controls {
      padding: 12px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 8px;
    }
    
    button {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .primary-btn {
      background: #1877f2;
      color: white;
    }
    
    .primary-btn:hover:not(:disabled) {
      background: #166fe5;
    }
    
    .secondary-btn {
      background: #e4e6eb;
      color: #050505;
    }
    
    .secondary-btn:hover:not(:disabled) {
      background: #d8dadf;
    }
    
    .status {
      padding: 8px 12px;
      font-size: 12px;
      text-align: center;
      display: none;
      background: #e7f3ff;
      color: #1877f2;
    }
    
    .status.show {
      display: block;
    }
    
    .status.error {
      background: #ffebe9;
      color: #d73a49;
    }
    
    .status.success {
      background: #dcffe4;
      color: #28a745;
    }
    
    .stats {
      display: none;
      padding: 12px;
      background: white;
      border-bottom: 1px solid #ddd;
      justify-content: space-around;
      text-align: center;
    }
    
    .stat-item {
      display: flex;
      flex-direction: column;
    }
    
    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: #1877f2;
    }
    
    .stat-label {
      font-size: 11px;
      color: #65676b;
      text-transform: uppercase;
    }
    
    .tabs {
      display: none;
      padding: 8px 12px;
      background: white;
      border-bottom: 1px solid #ddd;
      gap: 4px;
    }
    
    .tab-btn {
      flex: 1;
      padding: 8px;
      background: #f0f2f5;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      color: #65676b;
    }
    
    .tab-btn.active {
      background: #e7f3ff;
      color: #1877f2;
    }
    
    .results {
      padding: 12px;
      max-height: 300px;
      overflow-y: auto;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #65676b;
    }
    
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    .share-card {
      background: white;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    
    .share-card.exact-time {
      border-left: 3px solid #28a745;
    }
    
    .share-card .name {
      font-weight: 600;
      font-size: 14px;
      color: #050505;
      margin-bottom: 4px;
    }
    
    .share-card .time {
      font-size: 12px;
      color: #65676b;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    
    .share-card .badge {
      background: #28a745;
      color: white;
      font-size: 9px;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }
    
    .share-card .link {
      font-size: 11px;
      margin-top: 4px;
    }
    
    .share-card .link a {
      color: #1877f2;
      text-decoration: none;
    }
    
    .share-card .link a:hover {
      text-decoration: underline;
    }
    
    .export-options {
      display: none;
      padding: 12px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 8px;
    }
    
    .export-btn {
      flex: 1;
      padding: 8px;
      font-size: 11px;
      background: #f0f2f5;
      color: #050505;
    }
    
    .export-btn:hover {
      background: #e4e6eb;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📊 Social Share Extractor</h1>
    <p>Extract shares with exact timestamps</p>
  </div>
  
  <div class="controls">
    <button id="extractBtn" class="primary-btn">🔍 Extract Shares</button>
    <button id="clearBtn" class="secondary-btn">🗑️ Clear</button>
  </div>
  
  <div id="status" class="status"></div>
  
  <div id="stats" class="stats">
    <div class="stat-item">
      <span id="totalCount" class="stat-value">0</span>
      <span class="stat-label">Total</span>
    </div>
    <div class="stat-item">
      <span id="fbCount" class="stat-value">0</span>
      <span class="stat-label">Facebook</span>
    </div>
    <div class="stat-item">
      <span id="xCount" class="stat-value">0</span>
      <span class="stat-label">X/Twitter</span>
    </div>
  </div>
  
  <div id="tabs" class="tabs">
    <button class="tab-btn active" data-tab="all">All</button>
    <button class="tab-btn" data-tab="facebook">Facebook</button>
    <button class="tab-btn" data-tab="x">X/Twitter</button>
  </div>
  
  <div id="results" class="results">
    <div class="empty-state">
      <div class="icon">🔍</div>
      <p>Navigate to a Facebook post's "People who shared this" dialog or an X/Twitter post's retweets, then click "Extract Shares"</p>
    </div>
  </div>
  
  <div id="exportOptions" class="export-options">
    <button id="exportJSON" class="export-btn">📄 JSON</button>
    <button id="exportCSV" class="export-btn">📊 CSV</button>
    <button id="copyAll" class="export-btn">📋 Copy</button>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
